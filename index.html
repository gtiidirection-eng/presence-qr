<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Présence QR</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1b1d22; --accent:#0f9d6b; --muted:#6b7080; --danger:#d64545; --line:#8883; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151a; --card:#1e2028; --text:#ececf0; --muted:#9a9eac; }
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  header { background:var(--accent); color:#fff; padding:14px 16px; font-weight:700; font-size:1.15rem; }
  main { flex:1; overflow-y:auto; padding:14px; }
  section { display:none; }
  section.active { display:block; }
  nav { display:flex; background:var(--card); border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; color:var(--muted); padding:12px 4px; font-size:.85rem; }
  nav button.active { color:var(--accent); font-weight:700; }
  .card { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  input[type=text], input[type=date] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
        background:var(--bg); color:var(--text); font-size:1rem; }
  button.btn { border:0; background:var(--accent); color:#fff; border-radius:10px; padding:10px 14px; font-size:.95rem; }
  button.btn.alt { background:var(--bg); color:var(--text); border:1px solid var(--line); }
  button.btn.danger { background:var(--danger); }
  .small { font-size:.8rem; color:var(--muted); }
  #videoBox { position:relative; border-radius:14px; overflow:hidden; background:#000; aspect-ratio:1/1; }
  video { width:100%; height:100%; object-fit:cover; }
  #frame { position:absolute; inset:18%; border:3px solid #fff9; border-radius:16px; pointer-events:none; }
  #result { margin-top:12px; padding:14px; border-radius:12px; text-align:center; font-weight:600; display:none; }
  #result.in { background:#0f9d6b22; color:var(--accent); display:block; }
  #result.out { background:#e6a70022; color:#c98a00; display:block; }
  #result.err { background:#d6454522; color:var(--danger); display:block; }
  #modal { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  #modal.show { display:flex; }
  #modal .box { background:#fff; color:#111; border-radius:16px; padding:18px; text-align:center; max-width:340px; width:100%; }
  #modal canvas { max-width:100%; }
  .chip { display:inline-block; font-size:.8rem; padding:2px 8px; border-radius:10px; margin:2px 4px 2px 0; background:var(--bg); border:1px solid var(--line); }
  h2 { font-size:1.05rem; margin-bottom:10px; }
</style>
</head>
<body>
<header>📋 Présence QR</header>

<main>
  <!-- SCANNER -->
  <section id="tab-scan" class="active">
    <div id="videoBox"><video id="video" playsinline muted></video><div id="frame"></div></div>
    <canvas id="work" style="display:none"></canvas>
    <p id="camMsg" class="small" style="margin-top:8px"></p>
    <div id="result"></div>
    <p class="small" style="margin-top:10px">Un scan = arrivée. Le scan suivant = départ.</p>
  </section>

  <!-- TRAVAILLEURS -->
  <section id="tab-workers">
    <div class="card">
      <h2>Ajouter un travailleur</h2>
      <div class="row">
        <input type="text" id="newName" placeholder="Nom complet" maxlength="40" autocomplete="off">
        <button class="btn" id="addBtn">Ajouter</button>
      </div>
    </div>
    <div id="workerList"></div>
  </section>

  <!-- PRESENCES -->
  <section id="tab-logs">
    <div class="card">
      <input type="date" id="dateSel">
      <p class="small" id="summary" style="margin-top:8px"></p>
    </div>
    <div id="logList"></div>
    <button class="btn" id="exportBtn" style="width:100%;margin-top:6px">Partager / copier le rapport</button>
  </section>
</main>

<nav>
  <button data-tab="scan" class="active">📷 Scanner</button>
  <button data-tab="workers">👷 Travailleurs</button>
  <button data-tab="logs">🗓️ Présences</button>
</nav>

<div id="modal"><div class="box">
  <h2 id="qrName"></h2>
  <canvas id="qrCanvas"></canvas>
  <p class="small" style="color:#555;margin:8px 0">Fais une capture d'écran pour l'imprimer ou l'envoyer au travailleur.</p>
  <button class="btn" id="closeModal">Fermer</button>
</div></div>

<script src="lib/jsQR.js"></script>
<script src="lib/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let workers = load('pq_workers', []);
let logs = load('pq_logs', []);

const pad = n => String(n).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDur = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + 'h' + pad(m % 60); };

/* ---------- Onglets ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + b.dataset.tab));
  if (b.dataset.tab === 'scan') startCam(); else stopCam();
  if (b.dataset.tab === 'workers') renderWorkers();
  if (b.dataset.tab === 'logs') renderLogs();
});

/* ---------- Pointage ---------- */
function punch(w) {
  const now = Date.now();
  const today = dayKey(now);
  const mine = logs.filter(l => l.wid === w.id && dayKey(l.ts) === today);
  const last = mine[mine.length - 1];
  const type = (!last || last.type === 'out') ? 'in' : 'out';
  logs.push({ wid: w.id, name: w.name, type, ts: now });
  save('pq_logs', logs);
  showResult(type, w.name + (type === 'in' ? ' — arrivée à ' : ' — départ à ') + hhmm(now));
  if (navigator.vibrate) navigator.vibrate(200);
}
function showResult(cls, text) {
  const r = $('#result');
  r.className = cls; r.textContent = text;
}

/* ---------- Caméra / scan ---------- */
const video = $('#video'), work = $('#work'), ctx = work.getContext('2d', { willReadFrequently: true });
let stream = null, scanning = false, lastCode = '', lastTime = 0;

async function startCam() {
  if (scanning) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    $('#camMsg').textContent = '';
    tick();
  } catch (e) {
    $('#camMsg').textContent = "Caméra indisponible. Autorise la caméra dans les réglages, ou pointe à la main dans l'onglet Travailleurs.";
  }
}
function stopCam() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
function tick() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
    const scale = Math.min(1, 480 / video.videoWidth);
    const w = Math.floor(video.videoWidth * scale), h = Math.floor(video.videoHeight * scale);
    work.width = w; work.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const code = (typeof jsQR === 'function') ? jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' }) : null;
    if (code && code.data) handleCode(code.data);
  }
  requestAnimationFrame(tick);
}
function handleCode(data) {
  if (!data.startsWith('PRESENCE:')) return;
  const now = Date.now();
  if (data === lastCode && now - lastTime < 4000) return;
  lastCode = data; lastTime = now;
  const w = workers.find(x => x.id === data.slice(9));
  if (!w) { showResult('err', 'QR inconnu : travailleur non enregistré'); return; }
  punch(w);
}

/* ---------- Travailleurs ---------- */
function renderWorkers() {
  const box = $('#workerList');
  box.innerHTML = '';
  if (!workers.length) {
    const p = document.createElement('p'); p.className = 'small'; p.textContent = 'Aucun travailleur pour le moment.';
    box.appendChild(p); return;
  }
  workers.forEach(w => {
    const card = document.createElement('div'); card.className = 'card';
    const name = document.createElement('div'); name.style.fontWeight = '600'; name.textContent = w.name;
    const code = document.createElement('div'); code.className = 'small'; code.textContent = 'Code : ' + w.id;
    const actions = document.createElement('div'); actions.className = 'row'; actions.style.marginTop = '8px';
    const bQr = document.createElement('button'); bQr.className = 'btn'; bQr.textContent = 'Voir le QR';
    bQr.onclick = () => showQr(w);
    const bPunch = document.createElement('button'); bPunch.className = 'btn alt'; bPunch.textContent = 'Pointer à la main';
    bPunch.onclick = () => { punch(w); alert($('#result').textContent); };
    const bDel = document.createElement('button'); bDel.className = 'btn danger'; bDel.textContent = '🗑';
    bDel.onclick = () => {
      if (confirm('Supprimer ' + w.name + ' ? (son historique est conservé)')) {
        workers = workers.filter(x => x.id !== w.id); save('pq_workers', workers); renderWorkers();
      }
    };
    actions.append(bQr, bPunch, bDel);
    card.append(name, code, actions);
    box.appendChild(card);
  });
}
$('#addBtn').onclick = () => {
  const name = $('#newName').value.trim();
  if (!name) return;
  const id = Math.random().toString(36).slice(2, 8).toUpperCase() + Date.now().toString(36).slice(-3).toUpperCase();
  workers.push({ id, name });
  save('pq_workers', workers);
  $('#newName').value = '';
  renderWorkers();
};
function showQr(w) {
  $('#qrName').textContent = w.name;
  if (typeof QRCode !== 'undefined') {
    QRCode.toCanvas($('#qrCanvas'), 'PRESENCE:' + w.id, { width: 260, margin: 2 }, () => {});
  }
  $('#modal').classList.add('show');
}
$('#closeModal').onclick = () => $('#modal').classList.remove('show');

/* ---------- Présences ---------- */
$('#dateSel').value = dayKey(Date.now());
$('#dateSel').onchange = renderLogs;

function byWorkerForDay(day) {
  const map = new Map();
  logs.filter(l => dayKey(l.ts) === day).sort((a, b) => a.ts - b.ts).forEach(l => {
    if (!map.has(l.wid)) map.set(l.wid, { name: l.name, items: [] });
    map.get(l.wid).items.push(l);
  });
  return map;
}
function totalMs(items) {
  let total = 0, start = null;
  items.forEach(l => {
    if (l.type === 'in') start = l.ts;
    else if (start !== null) { total += l.ts - start; start = null; }
  });
  return { total, open: start !== null };
}
function renderLogs() {
  const day = $('#dateSel').value || dayKey(Date.now());
  const map = byWorkerForDay(day);
  const box = $('#logList');
  box.innerHTML = '';
  let present = 0;
  map.forEach(v => {
    const t = totalMs(v.items);
    if (t.open) present++;
    const card = document.createElement('div'); card.className = 'card';
    const head = document.createElement('div'); head.className = 'row';
    const n = document.createElement('strong'); n.textContent = v.name;
    const d = document.createElement('span'); d.className = 'small';
    d.textContent = t.open ? 'Présent • ' + fmtDur(t.total) : 'Total ' + fmtDur(t.total);
    head.append(n, d);
    card.appendChild(head);
    v.items.forEach(l => {
      const c = document.createElement('span'); c.className = 'chip';
      c.textContent = (l.type === 'in' ? '➡️ ' : '⬅️ ') + hhmm(l.ts);
      card.appendChild(c);
    });
    box.appendChild(card);
  });
  $('#summary').textContent = map.size
    ? map.size + ' pointé(s) • ' + present + ' encore présent(s)'
    : 'Aucun pointage ce jour-là.';
}
$('#exportBtn').onclick = async () => {
  const day = $('#dateSel').value || dayKey(Date.now());
  const map = byWorkerForDay(day);
  let txt = 'Rapport de présence du ' + day + '\n';
  if (!map.size) txt += 'Aucun pointage.\n';
  map.forEach(v => {
    const t = totalMs(v.items);
    txt += '\n' + v.name + ' (' + fmtDur(t.total) + (t.open ? ', encore présent' : '') + ')\n';
    v.items.forEach(l => { txt += '  ' + (l.type === 'in' ? 'Arrivée ' : 'Départ  ') + hhmm(l.ts) + '\n'; });
  });
  try {
    if (navigator.share) { await navigator.share({ title: 'Présence ' + day, text: txt }); return; }
  } catch (e) { return; }
  try { await navigator.clipboard.writeText(txt); alert('Rapport copié. Colle-le où tu veux.'); }
  catch (e) { alert(txt); }
};

startCam();
</script>
</body>
</html>
